<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dutchify — Vocab Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade { transition: opacity 0.15s; }
    .editing-row td { background: #fefce8; }
    input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<!-- ── Header ── -->
<header class="bg-white border-b sticky top-0 z-20 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6">
    <h1 class="text-xl font-bold text-orange-500 shrink-0">🇳🇱 Vocab Admin</h1>

    <!-- Global search -->
    <div class="flex items-center gap-2 flex-1 max-w-lg">
      <input id="searchInput" type="search" placeholder="Search all words…"
        class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm"
        oninput="onSearchInput()">
      <span id="searchCount" class="text-xs text-gray-400 whitespace-nowrap"></span>
    </div>

    <!-- Source toggle -->
    <div class="flex gap-3 text-sm shrink-0">
      <label class="flex items-center gap-1 cursor-pointer">
        <input type="radio" name="source" value="vocab" checked onchange="onSourceChange()"> Vocabulary
      </label>
      <label class="flex items-center gap-1 cursor-pointer">
        <input type="radio" name="source" value="traffic" onchange="onSourceChange()"> Traffic Signs
      </label>
    </div>

    <button onclick="openAddModal()"
      class="shrink-0 bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium px-4 py-1.5 rounded-lg">
      + Add Word
    </button>
  </div>
</header>

<!-- ── Main ── -->
<div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">

  <!-- Sidebar: category list -->
  <aside class="w-56 shrink-0">
    <div class="bg-white rounded-xl border p-3 sticky top-16 max-h-[calc(100vh-6rem)] overflow-y-auto">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2 px-1">Categories</p>
      <button onclick="selectCategory(null)"
        id="cat-all"
        class="w-full text-left px-2 py-1.5 rounded-lg text-sm font-medium bg-orange-50 text-orange-600 mb-1">
        All words
      </button>
      <div id="categoryList" class="space-y-0.5"></div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 min-w-0">
    <!-- Stats bar -->
    <div class="flex items-center justify-between mb-4">
      <h2 id="currentTitle" class="text-lg font-semibold text-gray-700">All words</h2>
      <span id="wordCount" class="text-sm text-gray-400"></span>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b text-xs text-gray-500 uppercase tracking-wide">
            <th class="text-left px-4 py-3 w-6">#</th>
            <th class="text-left px-4 py-3">Dutch</th>
            <th class="text-left px-4 py-3">English</th>
            <th class="text-left px-4 py-3">Example (NL)</th>
            <th class="text-left px-4 py-3">Example (EN)</th>
            <th class="text-left px-4 py-3 w-24">Category</th>
            <th class="px-4 py-3 w-20"></th>
          </tr>
        </thead>
        <tbody id="wordTable"></tbody>
      </table>
      <div id="emptyState" class="hidden text-center text-gray-400 py-12 text-sm">No words found.</div>
    </div>
  </main>
</div>

<!-- ── Add Word Modal ── -->
<div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
    <div class="flex justify-between items-center mb-5">
      <h3 class="text-lg font-bold">Add Word</h3>
      <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <form id="addForm" onsubmit="submitAdd(event)" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Category</label>
          <select id="addCategory" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">ID</label>
          <input id="addId" type="text" required placeholder="e.g. ver100" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Dutch *</label>
          <input id="addDutch" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">English *</label>
          <input id="addEnglish" type="text" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Example (Dutch)</label>
        <input id="addExDutch" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Example (English)</label>
        <input id="addExEnglish" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div id="addImageField" class="hidden">
        <label class="block text-xs font-medium text-gray-600 mb-1">Image Asset (e.g. a1.png)</label>
        <input id="addImage" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-lg text-sm">Add Word</button>
        <button type="button" onclick="closeAddModal()" class="flex-1 border border-gray-300 text-gray-600 font-medium py-2 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
      </div>
      <p id="addMsg" class="text-center text-sm font-medium"></p>
    </form>
  </div>
</div>

<script>
  // ── State ─────────────────────────────────────────────────────────────────
  let allWords = [];
  let filteredWords = [];
  let categories = [];
  let selectedCategoryId = null;
  let editingWordId = null;

  function source() {
    return document.querySelector('input[name="source"]:checked').value;
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  async function init() {
    await Promise.all([loadCategories(), loadAllWords()]);
  }

  async function onSourceChange() {
    selectedCategoryId = null;
    document.getElementById('searchInput').value = '';
    await init();
    renderCategoryList();
    applyFilters();
  }

  // ── Data loading ──────────────────────────────────────────────────────────
  async function loadCategories() {
    try {
      const res = await fetch(`/api/categories/${source()}`);
      categories = await res.json();
      renderCategoryList();
      populateAddCategorySelect();
    } catch (e) {
      console.error(e);
    }
  }

  async function loadAllWords() {
    try {
      const res = await fetch(`/api/words/${source()}`);
      allWords = await res.json();
      applyFilters();
    } catch (e) {
      console.error(e);
    }
  }

  // ── Filters ───────────────────────────────────────────────────────────────
  function applyFilters() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredWords = allWords.filter(w => {
      if (selectedCategoryId && w.categoryId !== selectedCategoryId) return false;
      if (!q) return true;
      return (w.dutch ?? '').toLowerCase().includes(q)
          || (w.english ?? '').toLowerCase().includes(q)
          || (w.exampleDutch ?? '').toLowerCase().includes(q);
    });
    renderTable();
    document.getElementById('wordCount').textContent = `${filteredWords.length} word${filteredWords.length !== 1 ? 's' : ''}`;
    const sc = document.getElementById('searchCount');
    sc.textContent = q ? `${filteredWords.length} result${filteredWords.length !== 1 ? 's' : ''}` : '';
  }

  function onSearchInput() {
    applyFilters();
  }

  function selectCategory(id) {
    selectedCategoryId = id;
    editingWordId = null;
    document.querySelectorAll('[data-catbtn]').forEach(b => b.classList.remove('bg-orange-50', 'text-orange-600', 'font-medium'));
    const allBtn = document.getElementById('cat-all');
    if (id === null) {
      allBtn.classList.add('bg-orange-50', 'text-orange-600', 'font-medium');
      document.getElementById('currentTitle').textContent = 'All words';
    } else {
      allBtn.classList.remove('bg-orange-50', 'text-orange-600', 'font-medium');
      const cat = categories.find(c => c.id === id);
      document.getElementById('currentTitle').textContent = cat?.title ?? id;
      const btn = document.querySelector(`[data-catbtn="${id}"]`);
      btn?.classList.add('bg-orange-50', 'text-orange-600', 'font-medium');
    }
    applyFilters();
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderCategoryList() {
    const el = document.getElementById('categoryList');
    el.innerHTML = '';
    categories.forEach(cat => {
      const isIndented = cat.title.startsWith('  ');
      const btn = document.createElement('button');
      btn.dataset.catbtn = cat.id;
      btn.className = `w-full text-left px-2 py-1.5 rounded-lg text-sm hover:bg-gray-50 ${isIndented ? 'pl-5 text-gray-500' : ''}`;
      btn.textContent = cat.title.trim();
      btn.onclick = () => selectCategory(cat.id);
      el.appendChild(btn);
    });
  }

  function populateAddCategorySelect() {
    const sel = document.getElementById('addCategory');
    sel.innerHTML = '';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = cat.title.trim();
      sel.appendChild(opt);
    });
    if (selectedCategoryId) sel.value = selectedCategoryId;
  }

  function renderTable() {
    const tbody = document.getElementById('wordTable');
    const empty = document.getElementById('emptyState');

    if (filteredWords.length === 0) {
      tbody.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    tbody.innerHTML = '';
    filteredWords.forEach((word, i) => {
      const isEditing = word.id === editingWordId;
      const tr = document.createElement('tr');
      tr.className = `border-b last:border-0 ${isEditing ? 'editing-row' : 'hover:bg-gray-50'}`;
      tr.dataset.wordId = word.id;

      if (isEditing) {
        tr.innerHTML = `
          <td class="px-4 py-2 text-gray-400">${i + 1}</td>
          <td class="px-2 py-2"><input class="w-full border rounded px-2 py-1 text-sm" id="e-dutch" value="${esc(word.dutch)}"></td>
          <td class="px-2 py-2"><input class="w-full border rounded px-2 py-1 text-sm" id="e-english" value="${esc(word.english)}"></td>
          <td class="px-2 py-2"><input class="w-full border rounded px-2 py-1 text-sm" id="e-exDutch" value="${esc(word.exampleDutch ?? '')}"></td>
          <td class="px-2 py-2"><input class="w-full border rounded px-2 py-1 text-sm" id="e-exEnglish" value="${esc(word.exampleEnglish ?? '')}"></td>
          <td class="px-4 py-2 text-xs text-gray-400">${esc(word.categoryTitle ?? '')}</td>
          <td class="px-4 py-2">
            <div class="flex gap-2 justify-end">
              <button onclick="saveEdit('${esc(word.id)}','${esc(word.categoryId)}')"
                class="text-xs bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded font-medium">Save</button>
              <button onclick="cancelEdit()"
                class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded font-medium">Cancel</button>
            </div>
          </td>`;
      } else {
        tr.innerHTML = `
          <td class="px-4 py-2 text-gray-400 text-xs">${i + 1}</td>
          <td class="px-4 py-2 font-medium">${esc(word.dutch)}</td>
          <td class="px-4 py-2 text-gray-600">${esc(word.english)}</td>
          <td class="px-4 py-2 text-gray-400 text-xs italic">${esc(word.exampleDutch ?? '')}</td>
          <td class="px-4 py-2 text-gray-400 text-xs italic">${esc(word.exampleEnglish ?? '')}</td>
          <td class="px-4 py-2 text-xs text-gray-400">${esc(word.categoryTitle ?? '')}</td>
          <td class="px-4 py-2">
            <div class="flex gap-2 justify-end">
              <button onclick="startEdit('${esc(word.id)}')"
                class="text-xs text-blue-500 hover:text-blue-700 font-medium">Edit</button>
              <button onclick="deleteWord('${esc(word.id)}','${esc(word.categoryId)}','${esc(word.dutch)}')"
                class="text-xs text-red-400 hover:text-red-600 font-medium">Delete</button>
            </div>
          </td>`;
      }
      tbody.appendChild(tr);
    });
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ── Edit ──────────────────────────────────────────────────────────────────
  function startEdit(wordId) {
    editingWordId = wordId;
    renderTable();
    // Focus first input
    setTimeout(() => document.getElementById('e-dutch')?.focus(), 50);
  }

  function cancelEdit() {
    editingWordId = null;
    renderTable();
  }

  async function saveEdit(wordId, categoryId) {
    const dutch = document.getElementById('e-dutch').value.trim();
    const english = document.getElementById('e-english').value.trim();
    if (!dutch || !english) return;

    const word = {
      dutch,
      english,
      exampleDutch: document.getElementById('e-exDutch').value,
      exampleEnglish: document.getElementById('e-exEnglish').value,
    };

    try {
      const res = await fetch(`/api/words/${source()}/${encodeURIComponent(categoryId)}/${encodeURIComponent(wordId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word }),
      });
      if (!res.ok) throw new Error((await res.json()).error);

      // Update local state
      const w = allWords.find(w => w.id === wordId);
      if (w) Object.assign(w, word);
      editingWordId = null;
      applyFilters();
    } catch (e) {
      alert('Save failed: ' + e.message);
    }
  }

  // ── Delete ────────────────────────────────────────────────────────────────
  async function deleteWord(wordId, categoryId, dutch) {
    if (!confirm(`Delete "${dutch}"? This edits vocabulary.ts directly.`)) return;
    try {
      const res = await fetch(`/api/words/${source()}/${encodeURIComponent(categoryId)}/${encodeURIComponent(wordId)}`, {
        method: 'DELETE',
      });
      if (!res.ok) throw new Error((await res.json()).error);
      allWords = allWords.filter(w => w.id !== wordId);
      applyFilters();
    } catch (e) {
      alert('Delete failed: ' + e.message);
    }
  }

  // ── Add ───────────────────────────────────────────────────────────────────
  function openAddModal() {
    populateAddCategorySelect();
    const isTraffic = source() === 'traffic';
    document.getElementById('addImageField').classList.toggle('hidden', !isTraffic);
    document.getElementById('addModal').classList.remove('hidden');
    document.getElementById('addDutch').focus();
  }

  function closeAddModal() {
    document.getElementById('addModal').classList.add('hidden');
    document.getElementById('addForm').reset();
    document.getElementById('addMsg').textContent = '';
  }

  async function submitAdd(e) {
    e.preventDefault();
    const payload = {
      categoryId: document.getElementById('addCategory').value,
      word: {
        id: document.getElementById('addId').value.trim(),
        dutch: document.getElementById('addDutch').value.trim(),
        english: document.getElementById('addEnglish').value.trim(),
        exampleDutch: document.getElementById('addExDutch').value.trim(),
        exampleEnglish: document.getElementById('addExEnglish').value.trim(),
        imageAsset: document.getElementById('addImage').value.trim(),
      }
    };

    try {
      const res = await fetch(`/api/words/${source()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error((await res.json()).error);
      const msg = document.getElementById('addMsg');
      msg.className = 'text-center text-sm font-medium text-green-600';
      msg.textContent = 'Word added!';
      // Reload words and close after a beat
      await loadAllWords();
      setTimeout(closeAddModal, 800);
    } catch (e) {
      const msg = document.getElementById('addMsg');
      msg.className = 'text-center text-sm font-medium text-red-600';
      msg.textContent = 'Error: ' + e.message;
    }
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (editingWordId) cancelEdit();
      closeAddModal();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
